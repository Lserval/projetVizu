<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Production Viticole Française</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f8f9fa; text-align: center; }
        .header { margin-bottom: 20px; }
        
        /* Conteneur principal */
        .map-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding-bottom: 20px;
        }

        #map-container { width: 100%; height: 650px; }

        /* Style de l'année sélectionnée (Cadre Rouge) */
        #year-display { 
            display: inline-block;
            font-size: 24px; 
            font-weight: bold; 
            color: #b30000;
            background-color: #ffcccc;
            border: 2px solid #ff4d4d;
            border-radius: 8px;
            width: 80px;
            padding: 5px 10px;
            margin-top: 10px;
        }

        /* Onglets */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            padding: 10px 20px; border: 2px solid #ddd; background: white;
            cursor: pointer; border-radius: 25px; font-weight: bold; color: #666; transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #ffcccc !important; 
            border-color: #ff4d4d !important;
            color: #b30000 !important;
        }
        #loader { font-style: italic; color: #666; margin: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Production Viticole Française (2009-2018)</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchType(0, this)">Toutes couleurs</button>
            <button class="tab-btn" onclick="switchType(1, this)">Rouge & Rosé</button>
            <button class="tab-btn" onclick="switchType(2, this)">Vin Blanc</button>
        </div>
    </div>

    <div id="loader">Chargement des données...</div>

    <div class="map-wrapper">
        <div id="map-container"></div>
        <div id="year-display">2009</div>
    </div>

    <script>
        const csvFile = 'production_vins_2009_2018_v2.csv';
        const geojsonUrl = 'https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson';

        let globalData, years, wineTypes;

        async function init() {
            try {
                const [data, geojson] = await Promise.all([
                    d3.csv(csvFile),
                    d3.json(geojsonUrl)
                ]);

                globalData = data;
                document.getElementById('loader').style.display = 'none';
                years = [...new Set(data.map(d => d.Year))].sort();
                
                wineTypes = [
                    { label: 'Toutes couleurs', col: 'total_prod', colorscale: 'Viridis' },
                    { label: 'Rouge & Rosé', col: 'tot_rougerose', colorscale: 'Reds' },
                    { label: 'Blanc', col: 'tot_blanc', colorscale: 'Tealgrn' }
                ];

                const frames = years.map(year => {
                    const yearData = data.filter(d => d.Year === year);
                    return {
                        name: year,
                        data: wineTypes.map(type => ({
                            z: yearData.map(d => parseFloat(d[type.col]) || 0),
                            locations: yearData.map(d => d.Dept_Code)
                        }))
                    };
                });

                const traces = wineTypes.map((type, i) => ({
                    type: 'choropleth',
                    geojson: geojson,
                    featureidkey: 'properties.code',
                    locations: data.filter(d => d.Year === years[0]).map(d => d.Dept_Code),
                    z: data.filter(d => d.Year === years[0]).map(d => parseFloat(d[type.col]) || 0),
                    text: data.filter(d => d.Year === years[0]).map(d => d.Departements),
                    colorscale: type.colorscale,
                    visible: i === 0,
                    zmin: 0,
                    zmax: 1000000,
                    colorbar: { title: 'Hl', x: 0.9, len: 0.4, y: 0.5 },
                    hovertemplate: `<b>%{text}</b><br>Prod: %{z:,.0f} hl<extra></extra>`
                }));

                const layout = {
                    geo: {
                        projection: { type: 'mercator' },
                        center: { lat: 46.3, lon: 2.4 }, 
                        fitbounds: "locations",
                        showframe: false,
                    },
                    margin: { t: 10, b: 10, l: 10, r: 10 }, // On réduit les marges internes pour centrer
                    updatemenus: [{
                        type: 'buttons', 
                        x: 0.05, y: 0.1, // On descend les boutons sous la carte
                        xanchor: 'left', yanchor: 'top',
                        buttons: [
                            { method: 'animate', label: '▶ Lecture', args: [null, { frame: { duration: 600, redraw: true }, fromcurrent: true }] },
                            { method: 'animate', label: '⏸ Pause', args: [[null], { mode: 'immediate' }] }
                        ]
                    }],
                    sliders: [{
                        active: 0, 
                        x: 0.15, len: 0.7, y: -0.15, // Slider aligné avec les boutons
                        yanchor: 'top',
                        currentvalue: { visible: false }, 
                        steps: years.map(year => ({
                            label: year,
                            method: 'animate',
                            args: [[year], { mode: 'immediate', frame: { duration: 300, redraw: true } }]
                        }))
                    }]
                };

                Plotly.newPlot('map-container', traces, layout).then(() => {
                    Plotly.addFrames('map-container', frames);
                });

                // --- GESTION DU CADRE ANNEE ---
                const gd = document.getElementById('map-container');
                
                gd.on('plotly_sliderchange', function(e) {
                    document.getElementById('year-display').innerText = e.step.label;
                });

                gd.on('plotly_animatingframe', function(e) {
                    document.getElementById('year-display').innerText = e.name;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = "Erreur de chargement des données.";
            }
        }

        function switchType(index, btn) {
            if (!globalData) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const visibility = [false, false, false];
            visibility[index] = true;
            Plotly.restyle('map-container', { visible: visibility });
        }

        init();
    </script>
</body>
</html>
