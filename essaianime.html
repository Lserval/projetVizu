<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Production Viticole Française (2009-2018)</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; }
        #map-container { width: 100%; height: 800px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { margin-bottom: 20px; text-align: center; }
        #loader { font-style: italic; color: #666; }
    </style>
</head>
<body>

    <div class="controls">
        <h1>Évolution de la production de vin par département</h1>
        <p>Données cumulées de 2009 à 2018 (Hectolitres)</p>
        <div id="loader">Chargement des données viticoles et géographiques...</div>
    </div>

    <div id="map-container"></div>

    <script>
        // Chemins des fichiers
        const csvFile = 'production_vins_2009_2018_v2.csv';
        const geojsonUrl = 'https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson';

        async function init() {
            try {
                // 1. Chargement des données en parallèle
                const [data, geojson] = await Promise.all([
                    d3.csv(csvFile),
                    d3.json(geojsonUrl)
                ]);

                document.getElementById('loader').style.display = 'none';

                // 2. Extraire la liste des années uniques
                const years = [...new Set(data.map(d => d.Year))].sort();

                // 3. Création des "frames" pour l'animation
                const frames = years.map(year => {
                    const yearData = data.filter(d => d.Year === year);
                    return {
                        name: year,
                        data: [{
                            z: yearData.map(d => parseFloat(d.total_prod)),
                            locations: yearData.map(d => d.Dept_Code),
                            text: yearData.map(d => d.Departements)
                        }]
                    };
                });

                // 4. Configuration initiale (Trace 0)
                const traceInitial = {
                    type: 'choropleth',
                    geojson: geojson,
                    featureidkey: 'properties.code',
                    locations: frames[0].data[0].locations,
                    z: frames[0].data[0].z,
                    text: frames[0].data[0].text,
                    colorscale: 'Viridis',
                    zmin: 0,
                    zmax: 1000000, // On fixe l'échelle pour l'animation
                    colorbar: { title: 'Hl', thickness: 20 },
                    hovertemplate: '<b>%{text}</b><br>Production: %{z:,.0f} hl<extra></extra>'
                };

                // 5. Mise en page (Layout) avec Slider et Boutons
                const layout = {
                    geo: {
                        scope: 'europe',
                        resolution: 50,
                        center: { lon: 2.4, lat: 46.5 },
                        projection: { scale: 2500 },
                        showframe: false
                    },
                    margin: { t: 50, b: 50, l: 0, r: 0 },
                    updatemenus: [{
                        x: 0.1, y: 0, yanchor: 'top', xanchor: 'right',
                        showactive: false, type: 'buttons',
                        pad: { t: 87, r: 10 },
                        buttons: [{
                            method: 'animate',
                            args: [null, { fromcurrent: true, transition: { duration: 300 }, frame: { duration: 500, redraw: true } }],
                            label: 'Lecture'
                        }, {
                            method: 'animate',
                            args: [[null], { mode: 'immediate', transition: { duration: 0 }, frame: { duration: 0, redraw: true } }],
                            label: 'Pause'
                        }]
                    }],
                    sliders: [{
                        active: 0,
                        steps: years.map(year => ({
                            label: year,
                            method: 'animate',
                            args: [[year], { mode: 'immediate', transition: { duration: 300 }, frame: { duration: 300, redraw: true } }]
                        })),
                        x: 0.1, len: 0.9, xanchor: 'left', y: 0, yanchor: 'top', pad: { t: 50, b: 10 }
                    }]
                };

                // 6. Rendu
                Plotly.newPlot('map-container', [traceInitial], layout).then(() => {
                    Plotly.addFrames('map-container', frames);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = "Erreur : Impossible de charger le CSV. Assurez-vous d'utiliser un serveur local (Live Server).";
            }
        }

        init();
    </script>
</body>
</html>
